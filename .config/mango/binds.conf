# ~/.config/mango/binds.conf
# Format: bind=MODS,key,function,args   (mods: super,ctrl,alt,shift,none)
# Key names: see `wev`. `code:N` binds a physical key (used for Shift+number,
# whose keysym would otherwise change to ! @ # ...).
#
# Window management lives on SUPER. ALT is left free for applications
# (Alt+arrows = back/forward in browsers, move line in VS Code, Alt+Z, Alt+F...).
# Alt+Tab stays as the overview, the usual convention.

# --------------------------------------------------
# Apps and launchers
# --------------------------------------------------
bind=SUPER+SHIFT,Return,spawn,alacritty
bind=SUPER,p,spawn_shell,pgrep -x rofi >/dev/null && pkill -x rofi || rofi -show drun
bind=SUPER,v,spawn_shell,pgrep -x rofi >/dev/null && pkill -x rofi || cliphist list | rofi -dmenu -p '' | cliphist decode | wl-copy
bind=SUPER,e,spawn,nautilus
# Audio output / input device pickers (rofi)
bind=SUPER+ALT,o,spawn,~/.config/mango/scripts/change_output_device.py
bind=SUPER+ALT,i,spawn,~/.config/mango/scripts/change_input_device.py

# --------------------------------------------------
# Session
# --------------------------------------------------
bind=SUPER,r,reload_config
bind=SUPER+SHIFT,q,quit
bind=SUPER,q,killclient,

# --------------------------------------------------
# Focus and move windows
# --------------------------------------------------
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,k,focusstack,next
bind=SUPER,j,focusstack,prev
bind=SUPER,Tab,focusstack,next

bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
# Swap the focused window with the master
bind=SUPER,Return,zoom

bind=SUPER+ALT,Left,resizewin,-50,+0
bind=SUPER+ALT,Right,resizewin,+50,+0
bind=SUPER+ALT,Up,resizewin,+0,-50
bind=SUPER+ALT,Down,resizewin,+0,+50

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# --------------------------------------------------
# Window state
# --------------------------------------------------
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER+SHIFT,m,togglemaximizescreen,
bind=SUPER,space,togglefloating,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,i,restore_minimized
bind=SUPER,o,toggleoverlay,
# Show the window on every tag
bind=SUPER+SHIFT,g,toggleglobal,
bind=SUPER+SHIFT,z,toggle_scratchpad
bind=ALT,Tab,toggleoverview

# --------------------------------------------------
# Layouts
# --------------------------------------------------
bind=SUPER,t,setlayout,tile
bind=SUPER,m,setlayout,monocle
bind=SUPER,g,setlayout,grid
bind=SUPER,s,setlayout,scroller
bind=SUPER,c,switch_layout
# Scroller column width
bind=SUPER+SHIFT,e,set_proportion,1.0
bind=SUPER+SHIFT,x,switch_proportion_preset,
# Gaps
bind=SUPER+CTRL,x,incgaps,1
bind=SUPER+CTRL,z,incgaps,-1
bind=SUPER+CTRL,r,togglegaps

# --------------------------------------------------
# Tags
# --------------------------------------------------
# Super+1..9: view tag  ·  Super+Shift+1..9: move the window there (and follow)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,code:10,tag,1,0
bind=SUPER+SHIFT,code:11,tag,2,0
bind=SUPER+SHIFT,code:12,tag,3,0
bind=SUPER+SHIFT,code:13,tag,4,0
bind=SUPER+SHIFT,code:14,tag,5,0
bind=SUPER+SHIFT,code:15,tag,6,0
bind=SUPER+SHIFT,code:16,tag,7,0
bind=SUPER+SHIFT,code:17,tag,8,0
bind=SUPER+SHIFT,code:18,tag,9,0

# Neighbour tags: Super+Ctrl+arrows views, +Shift takes the window along
bind=SUPER+CTRL,Left,viewtoleft,0
bind=SUPER+CTRL,Right,viewtoright,0
bind=SUPER+CTRL+SHIFT,Left,tagtoleft,0
bind=SUPER+CTRL+SHIFT,Right,tagtoright,0
# Throw the window to the next / previous tag
bind=SUPER,n,tagtoright,0
bind=SUPER+SHIFT,n,tagtoleft,0

axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# --------------------------------------------------
# Quickshell (43pr shell)
# --------------------------------------------------
bind=SUPER,a,spawn,qs ipc call settings toggle
bind=SUPER,grave,spawn,qs ipc call powermenu toggle
bind=SUPER,x,spawn,qs ipc call notifications toggle
bind=SUPER,d,spawn,qs ipc call todo toggle
bind=SUPER,z,spawn,qs ipc call wheel toggle
bind=SUPER,w,spawn,qs -n -p ~/.config/quickshell/hyprquickpaper
bind=SUPER+SHIFT,w,spawn,qs ipc call bar toggle
bind=SUPER,Escape,spawn,qs ipc call lock lock
bind=SUPER+SHIFT,o,spawn,~/.config/mango/scripts/opacity.sh
bind=SUPER+SHIFT,l,spawn,python3 ~/.config/43pr/bin/theme.py toggle

# --------------------------------------------------
# Screenshots
# --------------------------------------------------
# Super+L: flameshot (select + annotate)
bind=SUPER,l,spawn,~/.config/mango/scripts/screenshot.sh
# Print / Shift+Print: full screen / area, saved to ~/Pictures, copied, preview
bind=NONE,Print,spawn_shell,f=~/Pictures/$(date +%s).png; grim "$f" && wl-copy < "$f" && qs ipc call screenshot notify "$f"
bind=SHIFT,Print,spawn_shell,f=~/Pictures/$(date +%s).png; grim -g "$(slurp)" "$f" && wl-copy < "$f" && qs ipc call screenshot notify "$f"

# --------------------------------------------------
# Media and hardware keys
# --------------------------------------------------
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Same as the bar's mic button: mutes/unmutes every microphone
bind=NONE,XF86AudioMicMute,spawn,qs ipc call mic toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
# External monitor brightness over DDC/CI (brightnessctl only drives internal panels)
bind=NONE,XF86MonBrightnessUp,spawn,ddcutil --noverify setvcp 10 + 10
bind=NONE,XF86MonBrightnessDown,spawn,ddcutil --noverify setvcp 10 - 10
