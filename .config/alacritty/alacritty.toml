[general]
# colors generated by ~/.config/43pr/bin/theme.py (wallpaper / preset themes)
import = ["~/.config/alacritty/colors.toml"]
live_config_reload = true

[[keyboard.bindings]]
key = "Return"
mods = "Control|Shift"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "K"
mods = "Control|Shift"
chars = "\u000c" # Sends 'clear' to the shell

[[keyboard.bindings]]
key = "K"
mods = "Control|Shift"
action = "ClearHistory" # Wipes the scrollback buffer

[font]
# Point size
size = 14.0

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
