# ~/.config/mango/rules.conf

windowrule=isfloating:1,appid:.*[Pp]erssua.*

# flameshot's capture overlay must cover the screen, not be tiled
windowrule=isfloating:1,isfullscreen:1,isnoanimation:1,isnoborder:1,appid:flameshot

# Quickshell layers are namespaced "quickshell" unless the QML sets
# WlrLayershell.namespace; the 43pr panels animate themselves.
layerrule=noanim:1,layer_name:quickshell.*
layerrule=noshadow:1,layer_name:quickshell.*

layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
