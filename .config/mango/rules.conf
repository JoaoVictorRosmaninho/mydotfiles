# ~/.config/mango/rules.conf
#
# Dialogs that have a parent window and fixed-size windows already float on
# their own; these rules are for standalone utility apps.

# --------------------------------------------------
# Apps on their tag (new windows of these apps always go there; move one
# to a task tag with Super+Shift+<n>)
# --------------------------------------------------
windowrule=tags:1,appid:^google-chrome$
windowrule=tags:2,appid:^code$

# --------------------------------------------------
# Named scratchpads (Super+U terminal, Super+B Slack): float over any tag,
# shown/hidden with the same key
# --------------------------------------------------
windowrule=isnamedscratchpad:1,appid:^scratch-term$
windowrule=isnamedscratchpad:1,appid:^Slack$

# --------------------------------------------------
# Floating utilities
# --------------------------------------------------
windowrule=isfloating:1,appid:.*[Pp]erssua.*
windowrule=isfloating:1,width:1100,height:700,appid:^(org\.pulseaudio\.pavucontrol|pavucontrol)$
windowrule=isfloating:1,width:900,height:600,appid:^nm-connection-editor$
windowrule=isfloating:1,appid:^(org\.gnome\.Calculator|gnome-calculator)$
windowrule=isfloating:1,appid:^(polkit-gnome-authentication-agent-1|polkit-gnome)$
windowrule=isfloating:1,appid:^syncthingtray$
# Chrome / Firefox picture-in-picture: floating and on every tag
windowrule=isfloating:1,isglobal:1,title:^(Picture[- ]in[- ][Pp]icture|Imagem no imagem)$

# flameshot's capture overlay must cover the screen, not be tiled
windowrule=isfloating:1,isfullscreen:1,isnoanimation:1,isnoborder:1,appid:flameshot

# --------------------------------------------------
# Layers
# --------------------------------------------------
# Quickshell layers are namespaced "quickshell" unless the QML sets
# WlrLayershell.namespace; the 43pr panels animate themselves.
layerrule=noanim:1,layer_name:quickshell.*
layerrule=noshadow:1,layer_name:quickshell.*

layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
