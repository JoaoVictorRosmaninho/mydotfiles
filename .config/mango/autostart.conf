# ~/.config/mango/autostart.conf

# Session environment for D-Bus activated services (portals, notifications...)
exec-once = dbus-update-activation-environment --all

# Portals, audio, wallpaper, quickshell, saved monitor layout
exec-once = ~/.config/mango/autostart.sh

exec-once = /usr/sbin/gnome-keyring-daemon --start --components=secrets
exec-once = syncthingtray --wait
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = nm-applet --indicator

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# GTK theme for gnome apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
