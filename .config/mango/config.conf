# ~/.config/mango/config.conf — MangoWC 0.17.5
# Docs: https://github.com/mangowm/mango/wiki
#
# Only settings that differ from mango's defaults (or that document an intent)
# are listed; anything not here uses the built-in default. Validate with `mango -c ~/.config/mango/config.conf -p`
# (-c must come before -p, otherwise the default config is checked).
#
# Split-out files (paths starting with ./ are relative to ~/.config/mango):
#   autostart.conf  programs started with the session
#   binds.conf      keybinds
#   rules.conf      window and layer rules
#   colors.conf     border colors, GENERATED by ~/.config/43pr/bin/theme.py
#   local.conf      optional, machine-specific overrides (not versioned)

# --------------------------------------------------
# Environment
# --------------------------------------------------
env = XDG_CURRENT_DESKTOP,mango
env = XDG_SESSION_TYPE,wayland
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1
# One cursor theme everywhere (mango, GTK, Qt, Electron, XWayland)
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

source=./autostart.conf

# --------------------------------------------------
# Monitor
# --------------------------------------------------
# LG UltraWide 2560x1080: the preferred mode is 60 Hz, but the panel does 75 Hz.
# Matched by make/model, so it never applies to another monitor.
monitorrule=make:LG Electronics,model:LG ULTRAWIDE,width:2560,height:1080,refresh:75

# --------------------------------------------------
# Look
# --------------------------------------------------
border_radius=6
# Blur only behind layer surfaces (the translucent Quickshell bar/panels)
blur_layer=1
blur_params_num_passes=2
cursor_theme=Adwaita

# --------------------------------------------------
# Animations
# --------------------------------------------------
layer_animations=1
animation_type_open=slide
animation_type_close=slide
zoom_initial_ratio=0.3
fadeout_begin_opacity=0.8
animation_duration_tag=350
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# --------------------------------------------------
# Layouts
# --------------------------------------------------
# Ultrawide: center_tile keeps a single window centred (width = mfact) instead
# of stretching it to 2560 px; with 2+ windows the master stays in the middle.
tagrule=id:1,layout_name:center_tile
tagrule=id:2,layout_name:center_tile
tagrule=id:3,layout_name:center_tile
tagrule=id:4,layout_name:center_tile
tagrule=id:5,layout_name:center_tile
tagrule=id:6,layout_name:center_tile
tagrule=id:7,layout_name:center_tile
tagrule=id:8,layout_name:center_tile
tagrule=id:9,layout_name:center_tile
# With 2 windows don't centre the master (that leaves the left third empty):
# 1 window = centred, 2 = side by side, 3+ = master in the middle.
center_when_single_stack=0

# Pressing the key of the tag you are already on goes back to the previous one
# (Super+5 on tag 5 -> back to 1). Super+Tab uses this to flip between the last two.
view_current_to_back=1

# Scroller (Super+S): column widths cycled with Super+Shift+X
scroller_default_proportion=0.8
scroller_proportion_preset=0.5,0.8,1.0

# --------------------------------------------------
# Input
# --------------------------------------------------
xkb_rules_layout=br
xkb_rules_variant=abnt2
numlockon=1

# --------------------------------------------------
# Opacity (Super+Shift+O rewrites these two lines)
# --------------------------------------------------
focused_opacity=1.0
unfocused_opacity=1.0

source=./colors.conf
source=./binds.conf
source=./rules.conf
source-optional=./local.conf
