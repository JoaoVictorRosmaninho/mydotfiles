# ~/.config/mango/autostart.conf

# D-Bus environment, audio, portals, monitor layout, wallpaper, idle, quickshell
exec-once = ~/.config/mango/autostart.sh

exec-once = /usr/sbin/gnome-keyring-daemon --start --components=secrets
exec-once = syncthingtray --wait
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = nm-applet --indicator

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Light/dark preference is set by ~/.config/43pr/bin/theme.py (Super+Shift+L)
